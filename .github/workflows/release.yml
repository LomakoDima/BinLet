name: Release

# Push a tag like v1.0.0 to build the single-file exe and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish BinLet/BinLet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o out

      # Code signing goes here, between Publish and Create release: sign out/BinLet.exe, then
      # continue. Not wired up yet: it needs an approved SignPath Foundation project (or another
      # signing service) and its secrets. Follow SignPath's GitHub integration docs when ready.

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Move-Item out/BinLet.exe Binlet-win-x64.exe
          gh release create '${{ github.ref_name }}' Binlet-win-x64.exe --title '${{ github.ref_name }}' --generate-notes
