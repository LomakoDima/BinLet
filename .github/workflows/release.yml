name: Release

# Push a tag like v1.0.0 to build the single-file exe and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish BinLet/BinLet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o out

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path out/BinLet.exe -DestinationPath Binlet-${{ github.ref_name }}-win-x64.zip

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' 'Binlet-${{ github.ref_name }}-win-x64.zip' --title '${{ github.ref_name }}' --generate-notes
